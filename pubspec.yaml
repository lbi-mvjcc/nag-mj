name: nag_mj
description: "A lightweight task/note manager with recurring reminders"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  
  # Notifications
  flutter_local_notifications: ^17.2.1+1
  
  # Date/Time
  intl: ^0.19.0
  timezone: ^0.9.4
  
  # File Picker (for import/export)
  file_picker: ^8.1.2
  
  # Path
  path_provider: ^2.1.4
  
  # System Tray
  system_tray: ^2.0.3
  
  # Window Manager
  window_manager: ^0.4.2
  
  # Shared Preferences
  shared_preferences: ^2.3.2

  # Fonts
  google_fonts: ^6.2.1
  # Desktop notifications (Windows/macOS/Linux)
  local_notifier: ^0.1.6

  # Audio playback for bundled reminder sounds
  audioplayers: ^6.1.0

  # Configure app auto-start at OS login
  launch_at_startup: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.12
  isar_generator: ^3.1.0+1
  msix: ^3.16.13
  

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/sounds/alarm.mp3
msix_config:
  display_name: nag-MJ
  publisher_display_name: Logicbase Interactive Ent
  identity_name: com.logicbase.nagmj
  publisher: CN=Logicbase Interactive Ent
  msix_version: 1.0.0.0
  logo_path: assets/images/app_icon.png # Recommended size: at least 400x400px
  # dont_install_cert: true
  # capabilities: internetClient, location # Optional: define app permissions
